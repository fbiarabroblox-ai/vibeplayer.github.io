<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibes Player - Setup</title>
    <style>
        :root {
            --accent-color: #ff758c;
            --text-color: #ffffff;
            --btn-text-color: #121216;
            --card-bg: rgba(20, 20, 28, 0.85);
            --bg-blur: 15px;
            --bg-overlay: 0.4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0c0c0f;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        /* Затемнение фона */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, var(--bg-overlay));
            backdrop-filter: blur(var(--bg-blur));
            -webkit-backdrop-filter: blur(var(--bg-blur));
            z-index: 1;
            transition: backdrop-filter 0.3s ease, background 0.3s ease;
        }

        /* Холст для эффекта дождя */
        #rain-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .setup-card {
            position: relative;
            z-index: 3;
            width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
            overflow-y: auto;
            transition: background 0.3s ease, border-color 0.3s ease, backdrop-filter 0.3s ease;
        }

        /* Класс для Glassmorphism карточки */
        .setup-card.glass-style {
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(25px) !important;
            -webkit-backdrop-filter: blur(25px) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
        }

        .setup-card::-webkit-scrollbar {
            width: 6px;
        }

        .setup-card::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .setup-card h1 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setup-card p {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .setup-group {
            margin-bottom: 16px;
        }

        .setup-group label {
            display: block;
            font-size: 0.82rem;
            opacity: 0.7;
            margin-bottom: 6px;
        }

        .setup-group select, 
        .setup-group input[type="color"], 
        .setup-group input[type="range"],
        .setup-group input[type="text"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: inherit;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .setup-group input[type="range"] {
            padding: 0;
            accent-color: var(--accent-color);
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            border: none;
        }

        .range-value {
            float: right;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .setup-group select option {
            background: #1a1a22;
            color: #fff;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 16px;
            user-select: none;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .section-divider {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.4;
            margin: 20px 0 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 4px;
        }

        .primary-btn {
            width: 100%;
            background: var(--accent-color);
            color: var(--btn-text-color) !important;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s, background 0.3s ease, color 0.3s ease, transform 0.1s ease;
            margin-top: 15px;
        }

        .primary-btn:hover {
            opacity: 0.9;
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        .info-badge {
            display: inline-block;
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 5px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <canvas id="rain-canvas"></canvas>

    <div class="setup-card" id="setup-card">
        <h1>Настройка вайба 🎧 <span class="info-badge">v2.5</span></h1>
        <p>Кастомизируй внешний вид плеера и фоновые эффекты под себя.</p>
        
        <div class="setup-group">
            <label for="category-select">Категория фонов:</label>
            <select id="category-select">
                <option value="Anime">Anime</option>
                <option value="Nature">Nature</option>
                <option value="Space">Space</option>
                <option value="Weather">Weather</option>
            </select>
        </div>

        <div class="setup-group">
            <label for="theme-select">Тема (изображение):</label>
            <select id="theme-select"></select>
        </div>

        <div class="setup-group">
            <label for="custom-image-input">Или указать прямую ссылку на фон:</label>
            <input type="text" id="custom-image-input" placeholder="https://example.com/image.jpg">
        </div>

        <div class="section-divider">Визуальные эффекты</div>

        <label class="checkbox-group">
            <input type="checkbox" id="glassmorphism-toggle">
            Стеклянный интерфейс (Glassmorphism)
        </label>

        <label class="checkbox-group">
            <input type="checkbox" id="blur-toggle" checked>
            Включить размытие фона (Blur)
        </label>

        <div class="setup-group" id="blur-intensity-group">
            <label for="blur-range">Интенсивность размытия: <span id="blur-val" class="range-value">15px</span></label>
            <input type="range" id="blur-range" min="0" max="40" value="15">
        </div>

        <div class="setup-group">
            <label for="overlay-range">Затемнение фона (Оверлей): <span id="overlay-val" class="range-value">40%</span></label>
            <input type="range" id="overlay-range" min="0" max="90" value="40">
        </div>

        <label class="checkbox-group">
            <input type="checkbox" id="particles-toggle">
            Включить фоновые частицы (эффект дождя)
        </label>

        <div class="section-divider">Цветовая гамма</div>

        <label class="checkbox-group">
            <input type="checkbox" id="auto-theme-toggle" checked>
            Автоматически выбрать цвет по картинке
        </label>

        <div id="custom-color-container" class="setup-group hidden">
            <label for="custom-color-picker">Выберите цвет акцента:</label>
            <input type="color" id="custom-color-picker" value="#ff758c">
        </div>

        <button id="save-setup-btn" class="primary-btn">Готово, запустить плеер</button>
    </div>

    <script>
        const themesData = {
            Anime: ["Anime.jpg", "AnimeChina.jpg"],
            Nature: ["DarkForestWithHouse.jpg", "DarkNature.jpg", "RainForest.jpg"],
            Space: ["BlackHoleWarmYellow.jpg", "BlackHoleWhite.jpg", "BlackHoleWhiteOrange.jpg", "Cosmic.jpg"],
            Weather: ["BlueLightnings.jpg", "WhiteLightnings.jpg"]
        };

        const categorySelect = document.getElementById('category-select');
        const themeSelect = document.getElementById('theme-select');
        const customImageInput = document.getElementById('custom-image-input');
        
        const glassmorphismToggle = document.getElementById('glassmorphism-toggle');
        const blurToggle = document.getElementById('blur-toggle');
        const blurRange = document.getElementById('blur-range');
        const blurVal = document.getElementById('blur-val');
        const blurIntensityGroup = document.getElementById('blur-intensity-group');
        const overlayRange = document.getElementById('overlay-range');
        const overlayVal = document.getElementById('overlay-val');
        
        const autoThemeToggle = document.getElementById('auto-theme-toggle');
        const customColorContainer = document.getElementById('custom-color-container');
        const customColorPicker = document.getElementById('custom-color-picker');
        const particlesToggle = document.getElementById('particles-toggle');
        const saveSetupBtn = document.getElementById('save-setup-btn');
        const setupCard = document.getElementById('setup-card');

        /* --- ДВИЖОК ЭФФЕКТА ДОЖДЯ (CANVAS) --- */
        const canvas = document.getElementById('rain-canvas');
        const ctx = canvas.getContext('2d');
        let rainAnimationId = null;
        let drops = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Drop {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.length = Math.random() * 20 + 10;
                this.speed = Math.random() * 10 + 10;
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y + this.length);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.lineWidth = 1;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }

        function initRain() {
            drops = [];
            const dropCount = Math.floor(window.innerWidth / 4);
            for (let i = 0; i < dropCount; i++) {
                drops.push(new Drop());
            }
        }

        function animateRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drops.forEach(drop => {
                drop.update();
                drop.draw();
            });
            rainAnimationId = requestAnimationFrame(animateRain);
        }

        function toggleRain(enable) {
            if (enable) {
                if (!rainAnimationId) {
                    initRain();
                    animateRain();
                }
            } else {
                if (rainAnimationId) {
                    cancelAnimationFrame(rainAnimationId);
                    rainAnimationId = null;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
        }

        /* --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ЦВЕТА --- */
        function getRGBValues(colorStr) {
            let r = 0, g = 0, b = 0;
            if (colorStr.startsWith('rgb')) {
                const rgb = colorStr.match(/\d+/g);
                if (rgb) {
                    r = parseInt(rgb[0]);
                    g = parseInt(rgb[1]);
                    b = parseInt(rgb[2]);
                }
            } else if (colorStr.startsWith('#')) {
                let hex = colorStr.replace('#', '');
                if (hex.length === 3) hex = hex.split('').map(x => x + x).join('');
                r = parseInt(hex.substr(0, 2), 16) || 0;
                g = parseInt(hex.substr(2, 2), 16) || 0;
                b = parseInt(hex.substr(4, 2), 16) || 0;
            }
            return { r, g, b };
        }

        function getContrastTextColor(rgbColorStr) {
            const { r, g, b } = getRGBValues(rgbColorStr);
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness < 50 ? '#ffffff' : (brightness >= 128 ? '#121216' : '#ffffff');
        }

        // Делает цвет темнее и добавляет прозрачность для фона плашки
        function adjustColorBrightness(colorStr, factor = 0.25, alpha = 0.85) {
            const { r, g, b } = getRGBValues(colorStr);
            const darkR = Math.floor(r * factor);
            const darkG = Math.floor(g * factor);
            const darkB = Math.floor(b * factor);
            return `rgba(${darkR}, ${darkG}, ${darkB}, ${alpha})`;
        }

        function getActiveImagePath() {
            return customImageInput.value.trim() !== '' ? customImageInput.value.trim() : themeSelect.value;
        }

        function updateBackgroundPreview() {
            const imagePath = getActiveImagePath();
            const isBlur = blurToggle.checked;
            const blurPixels = blurRange.value + 'px';
            const overlayOpacity = overlayRange.value / 100;

            document.body.style.backgroundImage = `url('${imagePath}')`;
            document.documentElement.style.setProperty('--bg-blur', isBlur ? blurPixels : '0px');
            document.documentElement.style.setProperty('--bg-overlay', overlayOpacity);

            blurVal.textContent = blurPixels;
            overlayVal.textContent = overlayRange.value + '%';

            if (!isBlur) {
                blurIntensityGroup.classList.add('hidden');
            } else {
                blurIntensityGroup.classList.remove('hidden');
            }
        }

        function getAverageColor(imageSrc, callback) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = imageSrc;
            img.onload = function() {
                const canvasTmp = document.createElement('canvas');
                const ctxTmp = canvasTmp.getContext('2d');
                canvasTmp.width = 50;
                canvasTmp.height = 50;
                ctxTmp.drawImage(img, 0, 0, 50, 50);

                try {
                    const data = ctxTmp.getImageData(0, 0, 50, 50).data;
                    let r = 0, g = 0, b = 0, count = 0;

                    for (let i = 0; i < data.length; i += 4) {
                        r += data[i];
                        g += data[i+1];
                        b += data[i+2];
                        count++;
                    }

                    r = Math.floor(r / count);
                    g = Math.floor(g / count);
                    b = Math.floor(b / count);

                    callback(`rgb(${r}, ${g}, ${b})`);
                } catch (e) {
                    callback('rgb(255, 117, 140)');
                }
            };
            img.onerror = function() {
                callback('rgb(255, 117, 140)');
            };
        }

        function applyThemeColors(accentColor) {
            document.documentElement.style.setProperty('--accent-color', accentColor);
            const btnTextColor = getContrastTextColor(accentColor);
            document.documentElement.style.setProperty('--btn-text-color', btnTextColor);

            const isGlass = glassmorphismToggle.checked;
            if (isGlass) {
                setupCard.classList.add('glass-style');
            } else {
                setupCard.classList.remove('glass-style');
                // Темный оттенок текущего цвета акцента
                const darkCardBg = adjustColorBrightness(accentColor, 0.2, 0.85);
                setupCard.style.background = darkCardBg;
            }
        }

        function updateAccentUI() {
            const isAuto = autoThemeToggle.checked;
            const imagePath = getActiveImagePath();

            if (isAuto) {
                getAverageColor(imagePath, (color) => {
                    applyThemeColors(color);
                });
            } else {
                const customColor = customColorPicker.value;
                applyThemeColors(customColor);
            }
        }

        function updateThemeOptions() {
            const category = categorySelect.value;
            const themes = themesData[category] || [];
            
            themeSelect.innerHTML = '';
            themes.forEach(theme => {
                const option = document.createElement('option');
                option.value = `Themes/${category}/${theme}`;
                option.textContent = theme.replace('.jpg', '').replace(/([A-Z])/g, ' $1').trim();
                themeSelect.appendChild(option);
            });
            updateBackgroundPreview();
            updateAccentUI();
        }

        /* --- СОБЫТИЯ --- */
        categorySelect.addEventListener('change', updateThemeOptions);
        themeSelect.addEventListener('change', () => {
            customImageInput.value = '';
            updateBackgroundPreview();
            updateAccentUI();
        });
        
        customImageInput.addEventListener('input', () => {
            if (customImageInput.value.trim() !== '') {
                updateBackgroundPreview();
                updateAccentUI();
            }
        });

        glassmorphismToggle.addEventListener('change', updateAccentUI);
        blurToggle.addEventListener('change', updateBackgroundPreview);
        blurRange.addEventListener('input', updateBackgroundPreview);
        overlayRange.addEventListener('input', updateBackgroundPreview);

        particlesToggle.addEventListener('change', (e) => {
            toggleRain(e.target.checked);
        });

        autoThemeToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                customColorContainer.classList.add('hidden');
            } else {
                customColorContainer.classList.remove('hidden');
            }
            updateAccentUI();
        });

        customColorPicker.addEventListener('input', updateAccentUI);

        updateThemeOptions();

        /* --- СОХРАНЕНИЕ НАСТРОЕК --- */
        saveSetupBtn.addEventListener('click', () => {
            const themePath = getActiveImagePath();
            const isGlassEnabled = glassmorphismToggle.checked;
            const isBlurEnabled = blurToggle.checked;
            const blurValue = blurRange.value;
            const overlayValue = overlayRange.value;
            const isAutoTheme = autoThemeToggle.checked;
            const isParticles = particlesToggle.checked;
            
            localStorage.setItem('setup_completed', 'true');
            localStorage.setItem('player_theme', themePath);
            localStorage.setItem('player_glassmorphism', isGlassEnabled);
            localStorage.setItem('player_blur', isBlurEnabled);
            localStorage.setItem('player_blur_value', blurValue);
            localStorage.setItem('player_overlay', overlayValue);
            localStorage.setItem('player_auto_theme', isAutoTheme);
            localStorage.setItem('player_particles', isParticles);

            if (isAutoTheme) {
                getAverageColor(themePath, (avgColor) => {
                    localStorage.setItem('player_accent_color', avgColor);
                    localStorage.setItem('player_btn_text_color', getContrastTextColor(avgColor));
                    localStorage.setItem('player_card_bg', adjustColorBrightness(avgColor, 0.2, 0.85));
                    window.location.href = 'player.html';
                });
            } else {
                const customColor = customColorPicker.value;
                localStorage.setItem('player_accent_color', customColor);
                localStorage.setItem('player_btn_text_color', getContrastTextColor(customColor));
                localStorage.setItem('player_card_bg', adjustColorBrightness(customColor, 0.2, 0.85));
                window.location.href = 'player.html';
            }
        });
    </script>
</body>
</html>
