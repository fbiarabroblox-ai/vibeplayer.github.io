<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibes Player</title>
    <style>
        :root {
            --accent-color: #1db954;
            --text-color: #ffffff;
            --bg-dark: #0c0c0f;
            --card-bg: rgba(24, 24, 24, 0.75);
            --hover-bg: rgba(255, 255, 255, 0.1);
            --bg-blur: 0px;
            --bg-overlay: 0.35;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Фоновый слой: картинка + блюр + затемнение */
        .bg-blur-overlay {
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110vw;
            height: 110vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            pointer-events: none;
            filter: blur(var(--bg-blur));
            transition: filter 0.3s ease;
            transform: scale(1.05);
        }

        /* Тёмный оверлей поверх фона */
        .bg-blur-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, var(--bg-overlay));
        }

        /* Канвас для погодных эффектов */
        #effects-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        /* Элементы интерфейса */
        .top-bar, .main-content, .player-bar {
            position: relative;
            z-index: 3;
        }

        .top-bar {
            height: 70px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(12, 12, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.3s ease;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .search-container {
            flex: 0 1 450px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px 10px 42px;
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            background: rgba(0, 0, 0, 0.4);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.6;
            font-size: 0.9rem;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            padding: 8px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background: var(--hover-bg);
            transform: translateY(-1px);
        }

        .nav-btn.active {
            background: var(--accent-color);
            color: #121216;
            border-color: transparent;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .track-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-card:hover {
            background: rgba(40, 40, 48, 0.85);
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .track-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
            background: #222;
        }

        .track-card-title {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-card-artist {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .player-bar {
            height: 95px;
            background: rgba(12, 12, 15, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 300px;
        }

        .current-art {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            background: #222;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .current-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .curr-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .curr-artist {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .like-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            color: rgba(255,255,255,0.4);
            transition: 0.2s;
            margin-left: 10px;
        }

        .like-btn.liked {
            color: #ff4757;
        }

        .player-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 0 1 550px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .ctrl-btn:hover {
            color: #fff;
            transform: scale(1.1);
        }

        .play-pause-main {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #fff;
            color: #121216;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .play-pause-main:hover {
            transform: scale(1.08);
            background: var(--accent-color);
            color: #fff;
        }

        .seekbar-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            font-size: 0.75rem;
            opacity: 0.7;
        }

        .seekbar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .seekbar-progress {
            height: 100%;
            background: #fff;
            border-radius: 2px;
            width: 0%;
        }

        .player-right {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 300px;
            justify-content: flex-end;
            opacity: 0.8;
        }

        .volume-slider {
            width: 110px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="bg-blur-overlay" id="blur-overlay"></div>
    <canvas id="effects-canvas"></canvas>

    <div class="top-bar" id="top-bar">
        <div class="logo-section">
            <span>🎧 Vibes Player</span>
        </div>

        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Поиск треков по названию...">
        </div>

        <div class="top-actions">
            <button class="nav-btn" id="favorites-tab-btn">❤️ Любимые</button>
            <a href="setup.html" class="nav-btn">⚙️ Настройки</a>
            <a href="https://guns.lol/amper4k" target="_blank" class="nav-btn">Credits</a>
        </div>
    </div>

    <div class="main-content">
        <div class="section-title" id="section-title">Рекомендуемые треки 🔥</div>
        <div class="tracks-grid" id="tracks-grid"></div>
    </div>

    <div class="player-bar">
        <div class="player-left">
            <img src="" alt="" class="current-art" id="curr-art">
            <div class="current-info">
                <div class="curr-title" id="curr-title">Трек не выбран</div>
                <div class="curr-artist" id="curr-artist">—</div>
            </div>
            <button class="like-btn" id="like-btn">❤️</button>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button class="ctrl-btn" id="prev-btn">⏮</button>
                <button class="play-pause-main" id="play-pause-btn">▶</button>
                <button class="ctrl-btn" id="next-btn">⏭</button>
            </div>
            <div class="seekbar-container">
                <span id="current-time">0:00</span>
                <div class="seekbar" id="seekbar">
                    <div class="seekbar-progress" id="seekbar-progress"></div>
                </div>
                <span id="duration-time">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <span>🔊</span>
            <input type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" id="volume-slider">
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        let tracksData = [];
        let currentPlaylist = [];
        let currentIndex = 0;
        let isPlaying = false;
        let favorites = JSON.parse(localStorage.getItem('vibes_favorites')) || [];
        let showingFavorites = false;

        // --- 1. СИНХРОНИЗАЦИЯ НАСТРОЕК С SETUP.HTML ---
        function applySetupSettings() {
            const blurOverlay = document.getElementById('blur-overlay');
            const topBar = document.getElementById('top-bar');

            // Установка цвета акцента
            const savedAccent = localStorage.getItem('player_accent_color');
            if (savedAccent && savedAccent !== 'none') {
                document.documentElement.style.setProperty('--accent-color', savedAccent);
                topBar.style.background = `linear-gradient(135deg, ${savedAccent}33, rgba(12, 12, 15, 0.9))`;
            }

            // Установка фона
            const savedTheme = localStorage.getItem('player_theme');
            if (savedTheme) {
                blurOverlay.style.backgroundImage = `url('${savedTheme}')`;
            }

            // Установка размытия (фильтр блюра)
            // setup.html хранит это в ДВУХ ключах: player_blur (bool, вкл/выкл)
            // и player_blur_value (px). Раньше здесь читался несуществующий
            // формат — из-за этого блюр не работал вообще.
            const blurEnabled = localStorage.getItem('player_blur') === 'true';
            const savedBlurValue = localStorage.getItem('player_blur_value');
            const blurPx = blurEnabled ? (parseFloat(savedBlurValue) || 0) : 0;
            document.documentElement.style.setProperty('--bg-blur', `${blurPx}px`);
            // Чем больше блюр, тем больше нужно "запаса" по краям картинки,
            // иначе на большом blur виден резкий необработанный край.
            const overscan = Math.min(50, 5 + blurPx * 0.6); // в процентах
            blurOverlay.style.top = `-${overscan}%`;
            blurOverlay.style.left = `-${overscan}%`;
            blurOverlay.style.width = `${100 + overscan * 2}vw`;
            blurOverlay.style.height = `${100 + overscan * 2}vh`;

            // Прозрачность темного оверлея
            const savedOverlay = localStorage.getItem('player_overlay');
            if (savedOverlay !== null && savedOverlay !== undefined) {
                const overlayVal = savedOverlay > 1 ? savedOverlay / 100 : savedOverlay;
                document.documentElement.style.setProperty('--bg-overlay', overlayVal);
            }
        }
        applySetupSettings();

        // --- 2. ПОГОДНЫЕ ЭФФЕКТЫ (ДОЖДЬ / СНЕГ) ---
        const canvas = document.getElementById('effects-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        // setup.html сохраняет только один булевый переключатель дождя —
        // player_particles ("true"/"false"), ключа player_effect там нет.
        // Оставляем поддержку player_effect ('rain'/'snow') на будущее (если
        // появится выбор типа эффекта), но по умолчанию ориентируемся на
        // player_particles.
        function readEffectType() {
            const explicit = (localStorage.getItem('player_effect') || '').trim().toLowerCase();
            if (explicit === 'rain' || explicit === 'snow') return explicit;
            return localStorage.getItem('player_particles') === 'true' ? 'rain' : 'none';
        }
        let effectType = readEffectType();

        let dpr = Math.max(window.devicePixelRatio || 1, 1);

        function resizeCanvas() {
            dpr = Math.max(window.devicePixelRatio || 1, 1);
            // Реальный размер канваса в физических пикселях — иначе на экранах
            // с высоким DPR (почти все телефоны) дождь/снег выглядят мыльными.
            canvas.width = Math.round(window.innerWidth * dpr);
            canvas.height = Math.round(window.innerHeight * dpr);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            // Все координаты частиц ниже считаются в CSS-пикселях,
            // поэтому масштабируем контекст рисования один раз здесь.
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
            initEffects();
            startEffectsLoopIfNeeded();
        });
        resizeCanvas();

        // Живая синхронизация с setup.html (открытой в другой вкладке/окне),
        // чтобы дождь/блюр менялись сразу, без перезагрузки плеера.
        window.addEventListener('storage', (e) => {
            if (e.key === 'player_effect' || e.key === 'player_particles') {
                initEffects();
                startEffectsLoopIfNeeded();
            } else if (e.key === 'player_blur' || e.key === 'player_blur_value' ||
                       e.key === 'player_overlay' || e.key === 'player_accent_color' ||
                       e.key === 'player_theme') {
                applySetupSettings();
            }
        });

        function initEffects() {
            particles = [];
            effectType = readEffectType();

            // Используем CSS-пиксели (window.innerWidth/Height), а не
            // canvas.width/height — те теперь в физических пикселях (см. resizeCanvas).
            const w = window.innerWidth;
            const h = window.innerHeight;

            if (effectType === 'rain') {
                for (let i = 0; i < 200; i++) {
                    particles.push({
                        x: Math.random() * (w + 200) - 100,
                        y: Math.random() * h,
                        length: Math.random() * 20 + 15,
                        speed: Math.random() * 12 + 10,
                        drift: Math.random() * 2 + 1,
                        opacity: Math.random() * 0.4 + 0.2
                    });
                }
            } else if (effectType === 'snow') {
                for (let i = 0; i < 150; i++) {
                    particles.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        radius: Math.random() * 3 + 1,
                        speed: Math.random() * 1.5 + 0.5,
                        drift: Math.random() * 1 - 0.5
                    });
                }
            }
        }

        let effectsAnimationId = null;

        function animateEffects() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            ctx.clearRect(0, 0, w, h);

            if (effectType === 'rain') {
                ctx.lineWidth = 1.5;
                ctx.lineCap = 'round';
                particles.forEach(p => {
                    ctx.strokeStyle = `rgba(180, 210, 255, ${p.opacity})`;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - p.drift * 2, p.y + p.length);
                    ctx.stroke();

                    p.y += p.speed;
                    p.x -= p.drift;

                    if (p.y > h) {
                        p.y = -p.length;
                        p.x = Math.random() * (w + 200) - 100;
                    }
                });
            } else if (effectType === 'snow') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();

                    p.y += p.speed;
                    p.x += p.drift;

                    if (p.y > h) {
                        p.y = -10;
                        p.x = Math.random() * w;
                    }
                });
            }

            // Не гоняем requestAnimationFrame вхолостую, если эффект выключен —
            // экономим батарею/GPU на телефоне.
            if (effectType === 'rain' || effectType === 'snow') {
                effectsAnimationId = requestAnimationFrame(animateEffects);
            } else {
                effectsAnimationId = null;
            }
        }

        function startEffectsLoopIfNeeded() {
            if (effectsAnimationId === null && (effectType === 'rain' || effectType === 'snow')) {
                animateEffects();
            } else if (effectType !== 'rain' && effectType !== 'snow') {
                // Просто один раз очищаем канвас, если эффект отключили.
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            }
        }

        initEffects();
        startEffectsLoopIfNeeded();

        // --- 3. ЗАГРУЗКА И ПОИСК ТРЕКОВ ---
        async function fetchServerTracks() {
            try {
                let response = await fetch('/api/tracks').catch(() => null);
                if (!response || !response.ok) {
                    response = await fetch('/tracks/index.json').catch(() => null);
                }

                if (response && response.ok) {
                    const data = await response.json();
                    updateTracksList(data);
                } else {
                    const dirResponse = await fetch('/tracks/').catch(() => null);
                    if (dirResponse && dirResponse.ok) {
                        const html = await dirResponse.text();
                        const doc = new DOMParser().parseFromString(html, 'text/html');
                        const links = Array.from(doc.querySelectorAll('a'));
                        const folders = links
                            .map(a => a.getAttribute('href'))
                            .filter(href => href && href.endsWith('/') && !href.startsWith('..'))
                            .map(href => href.replace(/\/$/, ''));

                        const scannedTracks = folders.map(folder => ({
                            id: folder,
                            title: decodeURIComponent(folder).replace(/[-_]/g, ' '),
                            artist: 'Музыка',
                            folder: folder
                        }));
                        updateTracksList(scannedTracks);
                    }
                }
            } catch (err) {
                console.log('Поиск треков...', err);
            }
        }

        function updateTracksList(newTracks) {
            if (JSON.stringify(newTracks) !== JSON.stringify(tracksData)) {
                tracksData = newTracks;
                if (!showingFavorites) {
                    currentPlaylist = [...tracksData];
                    renderTracks(tracksData);
                }
            }
        }

        fetchServerTracks();
        setInterval(fetchServerTracks, 5000);

        // --- 4. ПЛЕЕР ---
        const audioElement = document.getElementById('audio-element');
        const tracksGrid = document.getElementById('tracks-grid');
        const searchInput = document.getElementById('search-input');
        const sectionTitle = document.getElementById('section-title');
        
        const currArt = document.getElementById('curr-art');
        const currTitle = document.getElementById('curr-title');
        const currArtist = document.getElementById('curr-artist');
        const likeBtn = document.getElementById('like-btn');
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        
        const seekbar = document.getElementById('seekbar');
        const seekbarProgress = document.getElementById('seekbar-progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        const volumeSlider = document.getElementById('volume-slider');
        const favoritesTabBtn = document.getElementById('favorites-tab-btn');

        function renderTracks(tracks) {
            tracksGrid.innerHTML = '';
            if (!tracks || tracks.length === 0) {
                tracksGrid.innerHTML = '<div style="opacity: 0.5; grid-column: 1/-1;">Ничего не найдено</div>';
                return;
            }

            tracks.forEach((track, index) => {
                const card = document.createElement('div');
                card.className = 'track-card';
                const coverPath = `/tracks/${track.folder}/cover.jpg`;

                card.innerHTML = `
                    <img src="${coverPath}" alt="${track.title}" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\' fill=\\'%23333\\'><rect width=\\'100\\' height=\\'100\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%23666\\' dominant-baseline=\\'middle\\' text-anchor=\\'middle\\'>🎵</text></svg>'">
                    <div class="track-card-title">${track.title}</div>
                    <div class="track-card-artist">${track.artist}</div>
                `;

                card.addEventListener('click', () => {
                    currentPlaylist = tracks;
                    currentIndex = index;
                    loadAndPlayTrack(currentIndex);
                });

                tracksGrid.appendChild(card);
            });
        }

        function loadAndPlayTrack(index) {
            if (!currentPlaylist || index < 0 || index >= currentPlaylist.length) return;
            currentIndex = index;
            const track = currentPlaylist[currentIndex];

            audioElement.src = `/tracks/${track.folder}/audio.mp3`;
            currTitle.textContent = track.title;
            currArtist.textContent = track.artist;
            currArt.src = `/tracks/${track.folder}/cover.jpg`;

            audioElement.play().then(() => {
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
            }).catch(e => console.log('Ошибка воспроизведения:', e));

            updateLikeButtonState();
        }

        playPauseBtn.addEventListener('click', () => {
            if (!audioElement.src) {
                if (currentPlaylist.length > 0) loadAndPlayTrack(0);
                return;
            }
            if (isPlaying) {
                audioElement.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶';
            } else {
                audioElement.play();
                isPlaying = true;
                playPauseBtn.textContent = '⏸';
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            loadAndPlayTrack(currentIndex);
        });

        nextBtn.addEventListener('click', () => {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            loadAndPlayTrack(currentIndex);
        });

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                const percent = (audioElement.currentTime / audioElement.duration) * 100;
                seekbarProgress.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(audioElement.currentTime);
                durationTimeEl.textContent = formatTime(audioElement.duration);
            }
        });

        seekbar.addEventListener('click', (e) => {
            const rect = seekbar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (audioElement.duration) {
                audioElement.currentTime = (clickX / rect.width) * audioElement.duration;
            }
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        volumeSlider.addEventListener('input', (e) => {
            audioElement.volume = e.target.value;
        });

        function updateLikeButtonState() {
            if (!currentPlaylist || currentPlaylist.length === 0 || !currentPlaylist[currentIndex]) return;
            const track = currentPlaylist[currentIndex];
            const isLiked = favorites.some(f => f.id === track.id);
            if (isLiked) {
                likeBtn.classList.add('liked');
            } else {
                likeBtn.classList.remove('liked');
            }
        }

        likeBtn.addEventListener('click', () => {
            if (!currentPlaylist || currentPlaylist.length === 0 || !currentPlaylist[currentIndex]) return;
            const track = currentPlaylist[currentIndex];
            const index = favorites.findIndex(f => f.id === track.id);

            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(track);
            }

            localStorage.setItem('vibes_favorites', JSON.stringify(favorites));
            updateLikeButtonState();

            if (showingFavorites) {
                renderTracks(favorites);
            }
        });

        favoritesTabBtn.addEventListener('click', () => {
            showingFavorites = !showingFavorites;
            if (showingFavorites) {
                favoritesTabBtn.classList.add('active');
                sectionTitle.textContent = "Любимые треки ❤️";
                renderTracks(favorites);
            } else {
                favoritesTabBtn.classList.remove('active');
                sectionTitle.textContent = "Рекомендуемые треки 🔥";
                renderTracks(tracksData);
            }
        });

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const sourceList = showingFavorites ? favorites : tracksData;
            const filtered = sourceList.filter(track => 
                track.title.toLowerCase().includes(query) || 
                track.artist.toLowerCase().includes(query)
            );
            renderTracks(filtered);
        });

        audioElement.addEventListener('ended', () => {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            loadAndPlayTrack(currentIndex);
        });
    </script>
</body>
</html>
